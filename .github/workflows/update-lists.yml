name: Update daftar saham & RD

# Jalan otomatis setiap kali data/Daftar_Saham_IDX.xlsx atau data/RD_kisi.xlsx di-upload/diubah.
on:
  workflow_dispatch:
  push:
    paths:
      - "data/Daftar_Saham_IDX.xlsx"
      - "data/RD_kisi.xlsx"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/update_lists.py
      - name: Simpan ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.js data/rd_kisi.js
          git diff --cached --quiet && exit 0
          git commit -m "data: perbarui daftar saham & RD"
          git push
